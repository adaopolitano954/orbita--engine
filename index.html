<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORBITA ENGINE 16</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#0f8;font-family:monospace;padding:10px}
h1{font-size:12px;border-bottom:2px solid #0f8;padding:8px 0}
#keybox{background:#111;padding:8px;display:flex;gap:6px;margin:10px 0;border:1px solid #333}
#keybox input{flex:1;background:#000;color:#0f8;border:1px solid #333;padding:7px}
#keybox button{background:#ff0;color:#000;border:0;padding:7px 12px;font-weight:bold}
.motores{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.motor{border:1px solid #0f8;padding:5px 8px;font-size:10px;cursor:pointer;border-radius:3px}
.free{background:#0f8;color:#000;font-weight:bold}
.pago{background:#1a1a1a;color:#666}
.ativo{outline:2px solid #ff0}
#chat{border:1px solid #333;height:52vh;overflow:auto;padding:10px;background:#080808}
#inputbox{display:flex;gap:6px;margin-top:8px}
#inputbox input{flex:1;background:#111;color:#fff;border:1px solid #0f8;padding:12px}
#inputbox button{background:#0f8;color:#000;border:0;padding:12px 18px;font-weight:bold}
.msg{margin:8px 0;font-size:13px;line-height:1.4}
</style>
</head>
<body>
<h1>ORBITA ENGINE - 16 MOTORES LIMPOS [8 FREE + 8 PRO]</h1>
<div id="keybox"><input id="key" placeholder="Cole sua chave sk-or-v1-..."><button onclick="saveKey()">SALVAR</button></div>
<div class="motores" id="list"></div>
<div id="chat">1. Cole a chave OpenRouter e SALVAR<br>2. Escolha motor VERDE = grátis<br>3. Pergunte</div>
<div id="inputbox"><input id="q" placeholder="Sua pergunta..."><button onclick="ask()">ENVIAR</button></div>

<script>
const M=[
{id:"deepseek/deepseek-r1:free",n:"DEEPSEEK R1",t:"free"},
{id:"meta-llama/llama-3.3-70b-instruct:free",n:"LLAMA 3.3 70B",t:"free"},
{id:"qwen/qwen-2.5-72b-instruct:free",n:"QWEN 72B",t:"free"},
{id:"google/gemini-2.0-flash-exp:free",n:"GEMINI 2.0 FLASH",t:"free"},
{id:"mistralai/mistral-7b-instruct:free",n:"MISTRAL 7B",t:"free"},
{id:"google/gemma-2-9b-it:free",n:"GEMMA 9B",t:"free"},
{id:"meta-llama/llama-3.1-8b-instruct:free",n:"LLAMA 8B",t:"free"},
{id:"nousresearch/hermes-3-llama-3.1-405b:free",n:"HERMES 405B",t:"free"},
{id:"openai/gpt-4o",n:"GPT-4o",t:"pago"},
{id:"anthropic/claude-3.5-sonnet",n:"CLAUDE 3.5",t:"pago"},
{id:"google/gemini-pro-1.5",n:"GEMINI PRO 1.5",t:"pago"},
{id:"meta-llama/llama-3.1-405b-instruct",n:"LLAMA 405B PRO",t:"pago"},
{id:"mistralai/mistral-large",n:"MISTRAL LARGE",t:"pago"},
{id:"qwen/qwen-2.5-coder-32b-instruct",n:"QWEN CODER",t:"pago"},
{id:"deepseek/deepseek-chat",n:"DEEPSEEK V3",t:"pago"},
{id:"openai/o1-mini",n:"O1 MINI",t:"pago"}
];
let ativo=M[0].id;
let KEY=localStorage.getItem("orbita_key")||"";
document.getElementById("key").value=KEY;

function render(){
 let d=document.getElementById("list");
 d.innerHTML="";
 M.forEach(m=>{
  let b=document.createElement("div");
  b.className=`motor ${m.t} ${ativo==m.id?"ativo":""}`;
  b.textContent=m.n+(m.t=="free"?" ✓FREE":" PRO");
  b.onclick=()=>{ativo=m.id;render()};
  d.appendChild(b);
 });
}
function saveKey(){
 KEY=document.getElementById("key").value.trim();
 localStorage.setItem("orbita_key",KEY);
 alert("Chave salva!");
}
async function ask(){
 let p=document.getElementById("q").value.trim();
 if(!p||!KEY) return alert("Falta chave ou pergunta");
 let c=document.getElementById("chat");
 c.innerHTML+=`<div class=msg><b>VC:</b> ${p}</div><div class=msg id=r><b>${ativo}:</b> pensando...</div>`;
 document.getElementById("q").value="";
 c.scrollTop=c.scrollHeight;
 try{
  let r=await fetch("https://openrouter.ai/api/v1/chat/completions",{
   method:"POST",
   headers:{"Authorization":"Bearer "+KEY,"Content-Type":"application/json","HTTP-Referer":"https://orbita-engine.vercel.app"},
   body:JSON.stringify({model:ativo,messages:[{role:"user",content:p}]})
  });
  let j=await r.json();
  let txt=j.choices?.[0]?.message?.content||JSON.stringify(j);
  document.getElementById("r").innerHTML=`<b>BOT:</b> ${txt}`;
  document.getElementById("r").id="";
  c.scrollTop=c.scrollHeight;
 }catch(e){
  document.getElementById("r").innerHTML="Erro: "+e.message;
 }
}
render();
</script>
</body>
</html>
