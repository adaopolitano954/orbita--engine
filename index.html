<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORBITA ENGINE - REAL 7 MOTORES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#0f8;font-family:monospace;height:100vh;display:flex;flex-direction:column}
header{border-bottom:2px solid #0f8;padding:10px;text-align:center}
h1{font-size:14px}
#keybox{padding:8px;background:#111;display:flex;gap:5px}
#keybox input{flex:1;background:#000;border:1px solid #444;color:#ff0;padding:8px;font-size:10px}
#keybox button{background:#ff0;color:#000;border:none;padding:8px 12px;font-weight:bold}
.motores{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:6px;background:#0a0a0a}
.motor{border:1px solid #0f8;padding:6px 8px;font-size:9px;cursor:pointer;opacity:.4}
.motor.ativo{background:#0f8;color:#000;opacity:1;font-weight:bold}
#chat{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:90%;padding:10px;border-radius:6px;font-size:11px;white-space:pre-wrap}
.user{align-self:flex-end;background:#0f8;color:#000}
.bot{align-self:flex-start;background:#111;border:1px solid #0f8}
.input-area{display:flex;gap:5px;padding:10px;border-top:2px solid #0f8}
#input{flex:1;background:#000;border:1px solid #0f8;color:#0f8;padding:10px}
#send{background:#0f8;color:#000;border:none;padding:10px 14px;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>ORBITA ENGINE - 7 MOTORES REAIS V3</h1>
<p style="font-size:8px;color:#666">DeepSeek | Scout | Maverick | GPT-4o | Claude | Gemini | Grok</p>
</header>

<div id="keybox">
<input id="apiKey" type="password" placeholder="Cole tua OpenRouter Key sk-or-... (openrouter.ai/keys)">
<button onclick="saveKey()">SALVAR</button>
</div>

<div class="motores" id="motores"></div>
<div id="chat"><div class="msg bot">REAL 7 MOTORES ONLINE V3.

Como ativar:
1- Entra openrouter.ai/keys
2- Cria conta e clica Create Key
3- Copia sk-or-...
4- Cola aqui em cima e SALVAR
5- Escolhe motor e testa.
</div></div>

<div class="input-area">
<input id="input" placeholder="Escreve tua ideia...">
<button id="send" onclick="enviar()">ENVIAR</button>
</div>

<script>
const MOTORES=[
{id:"deepseek/deepseek-chat",nome:"M0-DEEPSEEK R1"},
{id:"meta-llama/llama-3.3-70b-instruct",nome:"M1-SCOUT"},
{id:"meta-llama/llama-3.1-405b-instruct",nome:"M2-MAVERICK"},
{id:"openai/gpt-4o",nome:"M3-GPT-4O"},
{id:"anthropic/claude-3.5-sonnet",nome:"M4-CLAUDE"},
{id:"google/gemini-2.0-flash-001",nome:"M5-GEMINI"},
{id:"x-ai/grok-2-1212",nome:"M6-GROK"}
];
let motorAtual=0;
let apiKey=localStorage.getItem('orbita_key')||'';
document.getElementById('apiKey').value=apiKey;
const lista=document.getElementById('motores');
MOTORES.forEach((m,i)=>{
let d=document.createElement('div');
d.className='motor'+(i==0?' ativo':'');
d.innerText=m.nome;
d.onclick=()=>{motorAtual=i;document.querySelectorAll('.motor').forEach((x,idx)=>x.classList.toggle('ativo',idx==i))};
lista.appendChild(d)
});
function saveKey(){
apiKey=document.getElementById('apiKey').value.trim();
localStorage.setItem('orbita_key',apiKey);
alert('CHAVE SALVA!');
}
async function enviar(){
let inp=document.getElementById('input');
let txt=inp.value.trim();
if(!txt)return;
if(!apiKey){alert('Cola tua chave primeiro! openrouter.ai/keys');return}
let chat=document.getElementById('chat');
chat.innerHTML+=`<div class="msg user">${txt}</div>`;
inp.value='';
let bot=document.createElement('div');
bot.className='msg bot';
bot.innerHTML=`<b>${MOTORES[motorAtual].nome} pensando...</b>`;
chat.appendChild(bot);
chat.scrollTop=chat.scrollHeight;
try{
let r=await fetch('https://openrouter.ai/api/v1/chat/completions',{
method:'POST',
headers:{'Authorization':'Bearer '+apiKey,'Content-Type':'application/json','HTTP-Referer':'https://orbita-engine.vercel.app','X-Title':'Orbita Engine'},
body:JSON.stringify({model:MOTORES[motorAtual].id,messages:[{role:'system',content:'Você é '+MOTORES[motorAtual].nome+' do Orbita Engine Angola. Responda direto e prático.'},{role:'user',content:txt}]})
});
let j=await r.json();
if(j.error)throw new Error(j.error.message);
bot.innerHTML=`<b>${MOTORES[motorAtual].nome}:</b><br><br>${j.choices[0].message.content}`;
}catch(e){bot.innerHTML=`ERRO: ${e.message}`;}
chat.scrollTop=chat.scrollHeight
}
document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')enviar()});
</script>
</body>
</html>
